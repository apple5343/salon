services:
  postgres-test:
    image: postgres:14
    container_name: postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - app-network-test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  redis-test:
    image: redis:7-alpine
    container_name: redis-test
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - app-network-test
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  app-test:
    build:
      context: .
      target: main
    container_name: app-test
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - HTTP_SERVER_ADDR=${HTTP_SERVER_ADDR}
      - ACCESS_SECRET=${ACCESS_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${HTTP_SERVER_PORT:-8081}:${HTTP_SERVER_PORT:-8081}"
    networks:
      - app-network-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HTTP_SERVER_PORT:-8081}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
      admin-registry-test:
        condition: service_completed_successfully
  
  migrate-test:
    build:
      context: .
      target: migrate
    container_name: migrate-test
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - app-network-test
  
  admin-registry-test:
    build:
      context: .
      target: cli
    container_name: admin-registry-test
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - ACCESS_SECRET=${ACCESS_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
    command: ["register-admin", 
      "--email", "${ADMIN_EMAIL}", "--fullname", "${ADMIN_NAME}",
      "--phone", "${ADMIN_PHONE}", "--password", "${ADMIN_PASSWORD}",
      "--passport_series", "${ADMIN_PASSPORT_SERIES}", "--passport_number", "${ADMIN_PASSPORT_NUMBER}",
      "--passport_issued_by", "${ADMIN_PASSPORT_ISSUED_BY}"]
    depends_on:
      postgres-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    networks:
      - app-network-test
      
    

networks:
  app-network-test:
    driver: bridge