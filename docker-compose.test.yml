services:
  postgres-test:
    image: postgres:14
    container_name: postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - app-network-test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  app-test:
    build:
      context: .
      target: main
    container_name: app-test
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - HTTP_SERVER_ADDR=${HTTP_SERVER_ADDR}
    ports:
      - "${HTTP_SERVER_PORT:-8080}:${HTTP_SERVER_PORT:-8080}"
    networks:
      - app-network-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HTTP_SERVER_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
      admin-registry-test:
        condition: service_completed_successfully
  
  migrate-test:
    build:
      context: .
      target: migrate
    container_name: migrate-test
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - app-network-test
  
  admin-registry-test:
    build:
      context: .
      target: cli
    container_name: admin-registry-test
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
    command: ["register-admin", 
      "--email", "${ADMIN_EMAIL}", "--fullname", "${ADMIN_NAME}",
      "--phone", "${ADMIN_PHONE}", "--password", "${ADMIN_PASSWORD}",
      "--passport_series", "${ADMIN_PASSPORT_SERIES}", "--passport_number", "${ADMIN_PASSPORT_NUMBER}",
      "--passport_issued_by", "${ADMIN_PASSPORT_ISSUED_BY}"]
    depends_on:
      postgres-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    networks:
      - app-network-test
      
    

networks:
  app-network-test:
    driver: bridge