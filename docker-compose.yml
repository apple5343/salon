services:
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - appnet
  
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - appnet
  
  app:
    build:
      context: .
      target: main
    container_name: app
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - HTTP_SERVER_ADDR=${HTTP_SERVER_ADDR}
      - ACCESS_SECRET=${ACCESS_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${HTTP_SERVER_PORT:-8081}:${HTTP_SERVER_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - appnet
  
  migrate:
    build:
      context: .
      target: migrate
    container_name: migrate
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet
  
  admin-registry:
    build:
      context: .
      target: cli
    container_name: admin-registry
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - ACCESS_SECRET=${ACCESS_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
    command: ["register-admin", 
      "--email", "${ADMIN_EMAIL}", "--fullname", "${ADMIN_NAME}",
      "--phone", "${ADMIN_PHONE}", "--password", "${ADMIN_PASSWORD}",
      "--passport_series", "${ADMIN_PASSPORT_SERIES}", "--passport_number", "${ADMIN_PASSPORT_NUMBER}",
      "--passport_issued_by", "${ADMIN_PASSPORT_ISSUED_BY}"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - appnet

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  appnet:
    driver: bridge